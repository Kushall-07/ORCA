# ============================================================
# ORCA Temporal Validity Gate - configurable validity windows
# ============================================================
# version:  2026.02-mvp
#
# These are ORCA engineering / MVP validity windows, NOT authoritative
# meteorological guidance. The gate is deterministic: given the same inputs and
# this config it always returns the same VALID / STALE / INVALID / MISSING
# verdict. It never upgrades STALE data to VALID.
#
# Semantics:
#   * For a FORECAST record (has valid_from/valid_until):
#       - the requested decision time must fall within
#         [valid_from - forecast.alignment_seconds, valid_until]
#         (the lower bound has a one-hourly-step lead tolerance so a "right now"
#          query issued minutes before the first published hour still resolves;
#          the upper bound is NOT relaxed)
#       - AND the record must have been retrieved within
#         forecast.max_retrieval_seconds of "now"
#       -> VALID; otherwise INVALID (window missed) or STALE (retrieval age
#          between fresh and max).
#   * For an OBSERVATION record (has observed_at):
#       - age = |decision_time - observed_at|
#       - age <= fresh_seconds  -> VALID
#       - age <= stale_seconds  -> STALE
#       - otherwise             -> INVALID
#   * No usable timestamp        -> INVALID
#   * No value                   -> MISSING

version: "2026.02-mvp"
disclaimer: >-
  ORCA engineering / MVP validity windows. Not authoritative meteorological
  guidance. Review before operational use.

default:
  fresh_seconds: 3600        # 1 h
  stale_seconds: 21600       # 6 h

forecast:
  max_retrieval_seconds: 43200   # 12 h - a forecast fetched longer ago than this is not trusted
  stale_retrieval_seconds: 10800 # 3 h - fetched between this and max -> STALE
  alignment_seconds: 3600        # 1 h - one hourly step; decision time may lead
                                 #       valid_from by up to this and still be
                                 #       covered. valid_until stays a hard bound.

by_variable:
  wave_height:
    fresh_seconds: 3600
    stale_seconds: 21600
  swell_wave_height:
    fresh_seconds: 3600
    stale_seconds: 21600
  wind_speed:
    fresh_seconds: 3600
    stale_seconds: 10800
  weather_code:
    fresh_seconds: 3600
    stale_seconds: 10800
  mean_sea_level_pressure:
    fresh_seconds: 7200
    stale_seconds: 21600
  # Phase 9 environmental variables. These reflect the real cadence of the
  # products (a 6-hourly SST model field; a daily, cloud-gapped satellite
  # chlorophyll composite) - they are NOT a loosening of the gate. They apply
  # only to observation-style records (observed_at set); they do not change the
  # forecast branch that the existing wave/wind/pressure fields use.
  sea_surface_temperature:
    fresh_seconds: 43200        # 12 h
    stale_seconds: 172800       # 48 h
  chlorophyll_a:
    fresh_seconds: 172800       # 48 h  - a daily composite is "fresh" ~2 days
    stale_seconds: 864000       # 10 d  - an older cloud-free pixel is aged but usable
